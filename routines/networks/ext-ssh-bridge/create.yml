group:
  commands:
  - if:
      conditional:
        not:
          group:
            commands:
            - network:
                created:
                  name:
                    inventory: ext_ssh_bridge_network_name
      then:
        group:
          commands:
          - network:
              create:
                name:
                  inventory: ext_ssh_bridge_network_name
                isolated: true
