group:
  commands:
  - if:
      conditional:
        not:
          group:
            commands:
            - network:
                created:
                  name:
                    inventory: int_ssh_main_network_name
      then:
        group:
          commands:
          - network:
              create:
                name:
                  inventory: int_ssh_main_network_name
                isolated: true
